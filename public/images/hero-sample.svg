<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Illustration of a community center building at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1180" cy="300" r="120" fill="#fff7ed" opacity="0.9"/>
  <circle cx="1180" cy="300" r="170" fill="#fff7ed" opacity="0.3"/>

  <!-- distant hills -->
  <path d="M0 620 Q 300 520 640 600 T 1600 580 L1600 900 L0 900 Z" fill="#a3e635" opacity="0.55"/>

  <!-- ground -->
  <rect y="660" width="1600" height="240" fill="url(#ground)"/>

  <!-- community center building -->
  <g>
    <rect x="560" y="380" width="480" height="300" fill="url(#wall)" stroke="#d6d3d1" stroke-width="3"/>
    <!-- roof / pediment -->
    <polygon points="540,380 800,270 1060,380" fill="#b45309"/>
    <!-- columns -->
    <rect x="600" y="430" width="34" height="250" fill="#f5f5f4"/>
    <rect x="700" y="430" width="34" height="250" fill="#f5f5f4"/>
    <rect x="866" y="430" width="34" height="250" fill="#f5f5f4"/>
    <rect x="966" y="430" width="34" height="250" fill="#f5f5f4"/>
    <!-- door -->
    <rect x="762" y="520" width="76" height="160" rx="4" fill="#78350f"/>
    <circle cx="826" cy="600" r="5" fill="#fde68a"/>
    <!-- windows -->
    <rect x="628" y="470" width="70" height="70" rx="4" fill="#bae6fd"/>
    <rect x="902" y="470" width="70" height="70" rx="4" fill="#bae6fd"/>
  </g>

  <!-- foreground trees -->
  <g>
    <rect x="360" y="560" width="26" height="120" fill="#5b3a1a"/>
    <circle cx="373" cy="540" r="70" fill="#3f6212"/>
    <rect x="1220" y="560" width="26" height="120" fill="#5b3a1a"/>
    <circle cx="1233" cy="540" r="70" fill="#3f6212"/>
  </g>

  <!-- heart, the emotional core -->
  <path d="M800 150 C 770 110, 700 130, 700 185 C 700 235, 770 270, 800 300 C 830 270, 900 235, 900 185 C 900 130, 830 110, 800 150 Z" fill="#e11d48" opacity="0.92"/>
</svg>
